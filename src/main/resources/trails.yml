# Shimmer trails. This file holds trails and nothing else.
#
# Each trail has a display name and layers of particles that are sent while the player moves.
# A player needs the permission shimmer.trail.<id> (shimmer.trail.* gives all of them), or the one written in `permission`.
# Players pick one with /trail <id>.
#
# Trail settings
#   display      the name in /trail list and menus (default: the id)
#   permission   replaces shimmer.trail.<id>
#   interval     ticks between two puffs (default 3). Bigger is lighter for everybody's connection
#   moving       false to show the trail even when the player stands still (default true)
#
# Layer settings
#   particle     any particle name, such as DUST, END_ROD, FLAME, HEART
#   shape        SCATTER a cloud around the feet (default), RING points on a turning circle, HELIX two points that climb
#                the body, ORBIT one point that circles the waist
#   count        particles per puff. SCATTER sends them as one packet, whatever the count (default 1, at most 30)
#   spread       SCATTER: how wide the cloud is, in blocks (default 0.25)
#   height       SCATTER: how tall the cloud is (default 0.15). For HELIX, how high the spiral climbs
#   radius       RING, HELIX and ORBIT: size of the circle (default 0.4)
#   points       RING: how many points (default 4, at most 8)
#   offset       [x, y, z] moves the layer, y is up (default [0, 0.05, 0])
#   speed        how fast the particle drifts (default 0)
#
# Colours, for the particles that use them
#   colors       #rrggbb list. The puffs use them one after the other, so a layer with three colours shows all three
#   to           DUST_COLOR_TRANSITION: the colours it fades to, paired with `colors`
#   size         DUST and DUST_COLOR_TRANSITION: how big the dust is (default 1.0)
#   block        BLOCK, FALLING_DUST...: a list of block names
#   item         ITEM: a list of item names
#   notes        NOTE: a list of notes from 0 to 24

trails:
  yellow_pink:
    display: "Yellow Pink"
    interval: 2
    layers:
      - particle: DUST
        colors: ["#FFC0CB", "#FFF200", "#FFFFFF"]
        size: 1.1
        count: 4
        spread: 0.22
        height: 0.12
      - particle: END_ROD
        count: 1
        spread: 0.15
        height: 0.1
        speed: 0.01

  sunset:
