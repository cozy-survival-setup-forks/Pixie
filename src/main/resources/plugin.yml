name: Pixie
version: '${version}'
main: dev.pixie.PixiePlugin
api-version: '1.21'
description: Light, colourful particle trails
authors: [Groovified]
softdepend:
  - PlaceholderAPI

commands:
  trail:
    description: Pick and control your trail
    usage: /<command> <name> | off | toggle | visibility | list
    aliases: [trails]

permissions:
  pixie.use:
    description: Use /trail
    default: true
  pixie.admin:
    description: Reload, and set or clear the trail of other players
    default: op
  pixie.trail.*:
    description: Use every trail
    default: op
